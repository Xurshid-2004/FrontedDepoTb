# =====================================================================
# TB tizimi — Render Blueprint (backend + PostgreSQL)
#
# Frontend (Next.js) Vercel'da turadi — bu yerda faqat Django API va baza.
#
# Ishlatish:
#   Render → New → Blueprint → shu repo'ni tanlang.
#   Render `render.yaml` ni oʻqib xizmatlarni oʻzi yaratadi.
#
# Deploy'dan keyin QOʻLDA bajariladigan ikki narsa quyida
# "DEPLOY.md" da yozilgan (CORS domeni va admin paroli).
# =====================================================================

databases:
  - name: tb-db
    databaseName: tb
    user: tb
    plan: free            # 90 kundan keyin oʻchadi — jiddiy ishlatishda `basic-256mb`
    postgresMajorVersion: "16"

services:
  # -------------------------------------------------------------------
  # Django API
  # -------------------------------------------------------------------
  - type: web
    name: tb-api
    runtime: python
    plan: free            # 15 daq. jimlikdan keyin uxlaydi (pastdagi izohga qarang)
    region: frankfurt     # Oʻzbekistonga eng yaqin Render mintaqasi
    rootDir: Bacend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- baza: Render oʻzi ulaydi ---
      - key: DATABASE_URL
        fromDatabase:
          name: tb-db
          property: connectionString

      # --- kalitlar: Render tasodifiy yaratadi, hech kim koʻrmaydi ---
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # --- asosiy ---
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TZ
        value: Asia/Tashkent
      - key: LOG_LEVEL
        value: INFO
      - key: NEXT_PUBLIC_DEPO_KOD
        value: TCH-6

      # DJANGO_ALLOWED_HOSTS berilmasa settings.py RENDER_EXTERNAL_HOSTNAME
      # dan oʻzi oladi — domen oʻzgarsa ham ishlaydi.

      # --- CORS: Vercel domeningizni SHU YERGA yozing ---
      # Vercel loyihasi yaratilgach Render panelidan qiymatni almashtiring.
      # Bir nechta domen vergul bilan ajratiladi (preview deploy'lar uchun).
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # qiymat panelda qoʻlda kiritiladi
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # --- boshlangʻich maʼlumot (lavozimlar, normalar) ---
      - key: TB_SEED
        value: "1"

      # --- cheklovlar ---
      - key: THROTTLE_LOGIN
        value: 20/min
      - key: THROTTLE_WRITE
        value: 240/min
      - key: DATA_UPLOAD_MAX_MB
        value: "25"

      # --- FaceID ---
      # BOʻSH = yuz tanish oʻchiq, tizim faqat PIN bilan ishlaydi.
      # Yoqish uchun quyidagi `tb-face` xizmatini izohdan chiqaring va
      # bu yerga uning ichki manzilini yozing: http://tb-face:8000
      - key: FACE_SERVICE_URL
        sync: false
      - key: FACE_SERVICE_TOKEN
        generateValue: true
      - key: FACE_THRESHOLD
        value: "0.62"
      - key: FACE_TIMEOUT
        value: "25"        # bulutda CPU sekinroq — lokaldagidan koʻproq

  # -------------------------------------------------------------------
  # FaceID xizmati — IXTIYORIY
  # -------------------------------------------------------------------
  # DIQQAT: InsightFace modeli xotirada ~1.5 GB egallaydi.
  # Render'ning `free` va `starter` rejalari 512 MB beradi — YETMAYDI.
  # Kamida `standard` (2 GB) kerak. Shuning uchun izohga olingan:
  # byudjet tayyor boʻlganda izohni oching va tb-api dagi
  # FACE_SERVICE_URL ga `http://tb-face:8000` yozing.
  #
  # - type: pserv                     # ichki xizmat, tashqaridan ochiq emas
  #   name: tb-face
  #   runtime: docker
  #   plan: standard                  # 2 GB RAM — minimum
  #   region: frankfurt
  #   rootDir: face-service
  #   dockerfilePath: ./Dockerfile
  #   envVars:
  #     - key: FACE_TOKEN
  #       fromService:
  #         type: web
  #         name: tb-api
  #         envVarKey: FACE_SERVICE_TOKEN
  #     - key: FACE_THRESHOLD
  #       value: "0.62"

# =====================================================================
# `free` reja haqida bilib qoʻying:
#   15 daqiqa soʻrov boʻlmasa xizmat uxlaydi. Keyingi soʻrov uni
#   uygʻotadi — bu ~50 soniya davom etadi va frontend 30 soniyada
#   uzib yuboradi, yaʼni birinchi urinish xato beradi.
#   Haqiqiy foydalanuvchilar uchun `starter` rejaga oʻting.
# =====================================================================
